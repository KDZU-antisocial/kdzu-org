name = "kdzu-org-astro-site"
main = "dist/server/entry.mjs"
compatibility_flags = ["nodejs_compat"]
account_id = "38b2250cde779e4a92c63d139be80a9c"
compatibility_date = "2024-09-23"

# Required by @astrojs/cloudflare: server.js calls env.ASSETS.fetch() for /_astro/* CSS & JS.
# dist/client/.assetsignore excludes server bundle files from static assets.
[assets]
directory = "./dist/client"
binding = "ASSETS"

[env.production]
workers_dev = false
# No routes - this worker is only called by the main site worker

[observability.logs]
enabled = true 